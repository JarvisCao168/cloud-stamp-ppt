version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    networks:
      - yzppt-net

  backend:
    image: python:3.12-slim
    ports:
      - '8000:8000'
    volumes:
      - ./backend:/app
    working_dir: /app
    command: >
      sh -c "pip install -r requirements.txt 2>/dev/null || true &&
             python3 -m uvicorn main:app --host 0.0.0.0 --port 8000"
    networks:
      - yzppt-net

networks:
  yzppt-net:
    driver: bridge
